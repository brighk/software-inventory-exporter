[package]
name = "software-inventory-exporter"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only Linux software inventory and Prometheus exporter"

[dependencies]
anyhow = "1"
axum = "0.8"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
