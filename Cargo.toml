[package]
name = "software-inventory-exporter"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Software inventory agent, central database, Arch and OSV vulnerability assessment and Prometheus exporter"
rust-version = "1.95"
repository = "https://github.com/brighk/software-inventory-exporter"
readme = "README.md"
keywords = ["inventory", "vulnerability", "prometheus", "archlinux", "cvss"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
axum = "0.8"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
toml = "0.8"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
fs2 = "0.4"
alpm-types = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
