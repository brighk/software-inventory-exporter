# Publishes static Linux binaries, a multi-arch image on GHCR and a GitHub release
# when a version tag (v1.2.3) is pushed.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      matrix:
        include:
          - {runner: ubuntu-latest, arch: x86_64, docker_arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: aarch64, docker_arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static musl binary
        run: |
          docker run --rm -v "$PWD:/src" -w /src rust:1.100-alpine \
            sh -c 'apk add --no-cache musl-dev && cargo build --release --locked'
      - name: Package
        run: |
          name=software-inventory-exporter-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux
          mkdir -p "dist/$name" "image/${{ matrix.docker_arch }}"
          cp target/release/software-inventory-exporter "image/${{ matrix.docker_arch }}/"
          cp target/release/software-inventory-exporter LICENSE README.md "dist/$name/"
          cp -r examples "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*.tar.gz*
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.docker_arch }}
          path: image/
  image:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: image
          merge-multiple: true
      - run: chmod +x image/*/software-inventory-exporter
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  release:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
